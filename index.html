<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Life Game: Infinite Universe</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ffff;
            --secondary-color: #ff00ff;
            --bg-color: #050510;
            --glass-bg: rgba(10, 15, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0e0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            background-color: var(--bg-color);
            font-family: 'Roboto', sans-serif;
            color: var(--text-color);
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* UI Overlay Container */
        .ui-layer {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            /* Let clicks pass through to game */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .ui-top-bar,
        .ui-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            /* Re-enable clicks for UI elements */
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #infoContainer {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        /* Buttons */
        button {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 5px;
        }

        button:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 15px var(--primary-color);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Card Buttons */
        #cardsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 400px;
        }

        .card-button {
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            font-size: 0.75rem;
            padding: 6px 12px;
        }

        .card-button:hover {
            background: var(--secondary-color);
            color: #fff;
            box-shadow: 0 0 15px var(--secondary-color);
        }

        /* Popup */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        #popup>div {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid var(--primary-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
        }

        #popup p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* Controls Group */
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>

<body>
    <div id="game-container"></div>

    <div class="ui-layer">
        <div class="ui-top-bar">
            <div class="glass-panel controls-group">
                <div>
                    <h1>LIFEGAME: UNIVERSE</h1>
                    <div id="infoContainer">Initializing...</div>
                </div>
                <div style="margin-top: 10px;">
                    <button id="startButton">Start Simulation</button>
                    <button id="resetButton" style="display:none;">Reset Universe</button>
                    <button id="addSpaceshipButton">Spawn Spaceship</button>
                </div>
            </div>
        </div>

        <div class="ui-bottom-bar">
            <div class="glass-panel">
                <div style="margin-bottom: 5px; font-size: 0.8rem; color: #888;">ACTIVE CARDS</div>
                <div id="cardsContainer"></div>
            </div>
        </div>
    </div>

    <div id="popup"></div>
    <script src="dist/game.js?v=1763734859"></script>
</body>

</html>
